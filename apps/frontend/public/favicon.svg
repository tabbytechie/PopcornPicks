<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PopcornPicks">
    <!-- Brand tile: fixed Netflix dark with a single red accent, flat, no gradients. -->
    <rect width="64" height="64" rx="14" fill="#141414" />

    <defs>
        <clipPath id="bucket">
            <path d="M15 28 L49 28 L44 55 L20 55 Z" />
        </clipPath>
    </defs>

    <!-- Popped kernels sitting on the rim -->
    <g fill="#FFFFFF">
        <circle cx="22" cy="24" r="5" />
        <circle cx="31" cy="20" r="5.5" />
        <circle cx="41" cy="23" r="5" />
        <circle cx="27" cy="18" r="4" />
        <circle cx="37" cy="18" r="4" />
    </g>

    <!-- Striped popcorn bucket (red base + white vertical bands) -->
    <g clip-path="url(#bucket)">
        <rect x="15" y="28" width="34" height="27" fill="#E50914" />
        <path d="M23 28 L27 28 L25 55 L21 55 Z" fill="#FFFFFF" />
        <path d="M33 28 L37 28 L36 55 L32 55 Z" fill="#FFFFFF" />
        <path d="M43 28 L47 28 L46 55 L42 55 Z" fill="#FFFFFF" />
    </g>
</svg>
