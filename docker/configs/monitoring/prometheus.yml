# Prometheus Configuration for PopcornPicks

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'popcornpicks'
    environment: 'production'

# Alertmanager configuration (future)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres'

  # Node Exporter
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Backend application (future: add metrics endpoint)
  # - job_name: 'backend'
  #   static_configs:
  #     - targets: ['backend:3001']
  #   metrics_path: '/metrics'

  # Frontend application (future: add metrics endpoint)
