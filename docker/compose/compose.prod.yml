# Production Docker Compose Configuration
# Purpose: Production deployment with security, monitoring, and optimizations
# Usage: docker compose -f docker/compose/compose.prod.yml up -d

version: '3.9'

services:
  # PostgreSQL with all required extensions
  postgres:
    build:
      context: ../../images/postgres
      dockerfile: Dockerfile
    container_name: popcornpicks-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - postgres_backups_prod:/backups
    networks:
      - backend
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Backend API
  backend:
    build:
      context: ../../images/backend
      dockerfile: Dockerfile
      target: production
    container_name: popcornpicks-backend-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TMDB_API_KEY: ${TMDB_API_KEY}
      PORT: 3001
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend
  frontend:
    build:
      context: ../../images/frontend
      dockerfile: Dockerfile
      target: production
    container_name: popcornpicks-frontend-prod
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
    networks:
      - frontend
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Admin Panel
  admin:
    build:
      context: ../../images/admin
      dockerfile: Dockerfile
      target: production
    container_name: popcornpicks-admin-prod
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
    networks:
      - frontend
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: popcornpicks-nginx-prod
    volumes:
      - ../../configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../configs/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
      - backend
    depends_on:
      - frontend
      - backend
      - admin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # Background Worker
  worker:
    build:
      context: ../../images/worker
      dockerfile: Dockerfile
      target: production
    container_name: popcornpicks-worker-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TMDB_API_KEY: ${TMDB_API_KEY}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Scheduler
  scheduler:
    build:
      context: ../../images/worker
      dockerfile: Dockerfile
      target: production
    container_name: popcornpicks-scheduler-prod
    command: ["node", "dist/scheduler.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  frontend:
    driver: bridge
    internal: false
  backend:
    driver: bridge
    internal: true
  database:
    driver: bridge
    internal: true

volumes:
  postgres_data_prod:
    driver: local
  postgres_backups_prod:
    driver: local
