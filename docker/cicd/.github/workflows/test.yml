name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: popcornpicks_test
          POSTGRES_USER: popcornpicks
          POSTGRES_PASSWORD: test_password
        options: >-
          --healthcommand pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd database
          npm ci

      - name: Run database tests
        run: |
          cd database
          npm test
        env:
          DATABASE_URL: postgresql://popcornpicks:test_password@localhost:5432/popcornpicks_test

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: popcornpicks_test
          POSTGRES_USER: popcornpicks
          POSTGRES_PASSWORD: test_password
        options: >-
          --healthcommand pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/backend
          npm ci

      - name: Run backend tests
        run: |
          cd apps/backend
          npm test
        env:
          DATABASE_URL: postgresql://popcornpicks:test_password@localhost:5432/popcornpicks_test
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd apps/frontend
          npm test

  test-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/admin
          npm ci

      - name: Run admin tests
        run: |
          cd apps/admin
          npm test
