name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/backend
          npm ci

      - name: Run ESLint
        run: |
          cd apps/backend
          npm run lint

      - name: Run TypeScript check
        run: |
          cd apps/backend
          npx tsc --noEmit

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Run ESLint
        run: |
          cd apps/frontend
          npm run lint

      - name: Run TypeScript check
        run: |
          cd apps/frontend
          npx tsc --noEmit

  lint-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/admin
          npm ci

      - name: Run ESLint
        run: |
          cd apps/admin
          npm run lint

      - name: Run TypeScript check
        run: |
          cd apps/admin
          npx tsc --noEmit

  lint-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SQL linter
        uses: awshita/sql-lint-action@v1
        with:
          path: 'database/src'
